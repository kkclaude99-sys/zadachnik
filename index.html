/* ---------------------------------------------------------
   Утилиты дат
--------------------------------------------------------- */
function fmtLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() {
  return fmtLocal(new Date());
}
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addToDate(dateStr, freq) {
  const base = dateStr ? parseDate(dateStr) : new Date();
  const d = new Date(base);
  if (freq === "daily") d.setDate(d.getDate() + 1);
  else if (freq === "weekly") d.setDate(d.getDate() + 7);
  else if (freq === "monthly") d.setMonth(d.getMonth() + 1);
  return fmtLocal(d);
}
const MONTHS_SHORT = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
function humanDate(dateStr) {
  if (!dateStr) return null;
  const d = parseDate(dateStr);
  const t = parseDate(todayStr());
  const diffDays = Math.round((d - t) / 86400000);
  if (diffDays === 0) return "сегодня";
  if (diffDays === 1) return "завтра";
  if (diffDays === -1) return "вчера";
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
}
function humanDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const t = new Date();
  const sameDay = d.toDateString() === t.toDateString();
  const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  if (sameDay) return `сегодня, ${time}`;
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}, ${time}`;
}
function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function Icon({ name, size = 16, color = "currentColor", style, className }) {
  const common = {
    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round",
    style, className,
  };
  switch (name) {
    case "plus": return <svg {...common}><path d="M12 5v14M5 12h14" /></svg>;
    case "chevronDown": return <svg {...common}><path d="M6 9l6 6 6-6" /></svg>;
    case "chevronRight": return <svg {...common}><path d="M9 6l6 6-6 6" /></svg>;
    case "message": return <svg {...common}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>;
    case "repeat": return <svg {...common}><path d="M17 1l4 4-4 4" /><path d="M3 11V9a4 4 0 0 1 4-4h14" /><path d="M7 23l-4-4 4-4" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></svg>;
    case "calendar": return <svg {...common}><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>;
    case "x": return <svg {...common}><path d="M18 6L6 18M6 6l12 12" /></svg>;
    case "trash": return <svg {...common}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6" /></svg>;
    case "pencil": return <svg {...common}><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>;
    case "alertTriangle": return <svg {...common}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" /><path d="M12 9v4M12 17h.01" /></svg>;
    case "circle": return <svg {...common}><circle cx="12" cy="12" r="9" /></svg>;
    case "checkCircle": return <svg {...common}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="M22 4 12 14.01l-3-3" /></svg>;
    case "flag": return <svg {...common}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><line x1="4" y1="22" x2="4" y2="15" /></svg>;
    case "inbox": return <svg {...common}><path d="M22 12h-6l-2 3h-4l-2-3H2" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z" /></svg>;
    case "loader": return <svg {...common}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>;
    case "user": return <svg {...common}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>;
    case "archive": return <svg {...common}><rect x="2" y="3" width="20" height="5" rx="1" /><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4" /></svg>;
    case "ban": return <svg {...common}><circle cx="12" cy="12" r="10" /><line x1="4.93" y1="4.93" x2="19.07" y2="19.07" /></svg>;

    default: return null;
  }
}

/* ---------------------------------------------------------
   Popover — общий выпадающий контейнер с закрытием по клику вовне
--------------------------------------------------------- */
function Popover({ trigger, children, align = "left", open, onOpenChange }) {
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) {
      if (ref.current && !ref.current.contains(e.target)) onOpenChange(false);
    }
    if (open) document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open, onOpenChange]);

  return (
    <div ref={ref} style={{ position: "relative" }}>
      {trigger}
      {open && (
        <div
          style={{
            position: "absolute", [align]: 0, top: "calc(100% + 6px)",
            background: COLORS.surfaceRaised, border: `1px solid ${COLORS.border}`,
            borderRadius: 12, padding: 6, zIndex: 40, minWidth: 190,
            boxShadow: "0 10px 28px rgba(0,0,0,0.4)",
          }}
        >
          {children}
        </div>
      )}
    </div>
  );
}

function PopoverItem({ onClick, active, children }) {
  return (
    <button
      onClick={onClick}
      className="flex items-center gap-2 w-full"
      style={{
        padding: "7px 8px", borderRadius: 8, fontSize: 13.5, fontWeight: 600,
        color: COLORS.text, background: active ? COLORS.accentSoft : "transparent",
        textAlign: "left",
      }}
    >
      {children}
    </button>
  );
}

function AssigneeFilterDropdown({ value, onChange }) {
  // value: массив ключей ('sasha'|'kostya'|'nikita'); пустой массив = все
  const [open, setOpen] = useState(false);

  function toggle(k) {
    if (value.includes(k)) onChange(value.filter((x) => x !== k));
    else onChange([...value, k]);
  }

  const label = value.length === 0 ? "Все" : value.map((k) => PEOPLE[k].name).join(", ");

  return (
    <Popover
      open={open}
      onOpenChange={setOpen}
      trigger={
        <button
          onClick={() => setOpen((o) => !o)}
          className="flex items-center gap-1.5"
          style={{
            border: `1px solid ${COLORS.border}`, borderRadius: 999,
            padding: value.length > 0 ? "3px 10px 3px 3px" : "5px 10px",
            background: COLORS.surface, maxWidth: 220,
          }}
        >
          {value.length === 0 ? (
            <Icon name="user" size={14} color={COLORS.textDim} />
          ) : (
            <div className="flex items-center" style={{ flexShrink: 0 }}>
              {value.map((k, i) => (
                <div key={k} style={{ marginLeft: i === 0 ? 0 : -6, zIndex: value.length - i, borderRadius: "50%", border: `1.5px solid ${COLORS.surface}` }}>
                  <Avatar personKey={k} size={20} />
                </div>
              ))}
            </div>
          )}
          <span
            style={{
              color: value.length > 0 ? COLORS.text : COLORS.textDim, fontSize: 13, fontWeight: 600,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
            }}
          >
            {label}
          </span>
          <Icon name="chevronDown" size={13} color={COLORS.textFaint} style={{ flexShrink: 0 }} />
        </button>
      }
    >
      <PopoverItem active={value.length === 0} onClick={() => onChange([])}>
        <Icon name="user" size={16} color={COLORS.textDim} /> Все
      </PopoverItem>
      <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, margin: "4px 0" }} />
      {PEOPLE_LIST.map((k) => (
        <button
          key={k}
          onClick={() => toggle(k)}

          style={{
            padding: "7px 8px", borderRadius: 8, fontSize: 13.5, fontWeight: 600,
            color: COLORS.text, background: value.includes(k) ? COLORS.accentSoft : "transparent",
            textAlign: "left",

          <span style={{ flex: 1 }}>{PEOPLE[k].name}</span>
          {value.includes(k) && <Icon name="check" size={15} color={COLORS.accent} />}
        </button>
      ))}

        <PopoverItem onClick={() => setOpen(false)}>
          <span style={{ color: COLORS.accent, width: "100%", textAlign: "center" }}>Готово</span>
        </PopoverItem>
      </div>
    </Popover>
  );
}

/* ---------------------------------------------------------
   Выбор проекта — дропдаун с созданием нового маркера прямо внутри
--------------------------------------------------------- */
function ProjectDropdown({ projects, value, onChange, onCreate, allowAll }) {
  const [open, setOpen] = useState(false);
  const [creating, setCreating] = useState(false);
  const [code, setCode] = useState("");
  const [name, setName] = useState("");
  const [color, setColor] = useState(PROJECT_PALETTE[projects.length % PROJECT_PALETTE.length]);

  const current = projects.find((p) => p.id === value);
  const label = current ? current.code : allowAll ? "Все проекты" : "Без проекта";

  function resetForm() {
    setCreating(false);
    setCode("");
    setName("");
    setColor(PROJECT_PALETTE[projects.length % PROJECT_PALETTE.length]);
  }
  function submitCreate() {
    if (!code.trim()) return;
    const project = { id: uid("p"), code: code.trim().toUpperCase(), name: name.trim() || code.trim(), color };
    onCreate(project);
    onChange(project.id);
    resetForm();
    setOpen(false);
  }

  return (
    <Popover
      open={open}
      onOpenChange={(v) => { setOpen(v); if (!v) resetForm(); }}
      trigger={
        <button
          onClick={() => setOpen((o) => !o)}
          className="flex items-center gap-1.5"
          style={{
            border: `1px solid ${current ? current.color : COLORS.border}`, borderRadius: 999,
            padding: "5px 10px", background: current ? `${current.color}1E` : COLORS.surface,
          }}
        >
          {current && <ProjectDot color={current.color} />}
          <span style={{ color: current ? COLORS.text : COLORS.textDim, fontSize: 13, fontWeight: 700 }}>{label}</span>
          <Icon name="chevronDown" size={13} color={COLORS.textFaint} />
        </button>
      }
    >
      <div style={{ maxHeight: 260, overflowY: "auto" }}>
        {allowAll && (
          <PopoverItem active={value === null} onClick={() => { onChange(null); setOpen(false); }}>
            Все проекты
          </PopoverItem>
        )}
        {!allowAll && (
          <PopoverItem active={value === null} onClick={() => { onChange(null); setOpen(false); }}>
            Без проекта
          </PopoverItem>
        )}
        {projects.map((p) => (
          <PopoverItem key={p.id} active={value === p.id} onClick={() => { onChange(p.id); setOpen(false); }}>
            <ProjectDot color={p.color} />
            <span style={{ fontWeight: 700 }}>{p.code}</span>
            <span style={{ color: COLORS.textFaint, fontWeight: 500 }}>{p.name}</span>
          </PopoverItem>
        ))}
      </div>

      <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, marginTop: 4, paddingTop: 4 }}>
        {!creating ? (
          <PopoverItem onClick={() => setCreating(true)}>
            <Icon name="plus" size={15} color={COLORS.accent} /> <span style={{ color: COLORS.accent }}>Новый проект</span>
          </PopoverItem>
        ) : (
          <div style={{ padding: 6 }} onMouseDown={(e) => e.stopPropagation()}>
            <input
              value={code}
              onChange={(e) => setCode(e.target.value)}
              placeholder="Код, напр. БАР"
              maxLength={8}
              style={{
                width: "100%", background: COLORS.surface, border: `1px solid ${COLORS.border}`,
                borderRadius: 8, padding: "6px 8px", color: COLORS.text, fontSize: 13, outline: "none",
              }}
              className="mb-1.5"
            />
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Название проекта"
              style={{
                width: "100%", background: COLORS.surface, border: `1px solid ${COLORS.border}`,
                borderRadius: 8, padding: "6px 8px", color: COLORS.text, fontSize: 13, outline: "none",
              }}
              className="mb-1.5"
            />
            <div className="flex items-center gap-1.5 flex-wrap mb-2">
              {PROJECT_PALETTE.map((c) => (
                <button
                  key={c}
                  onClick={() => setColor(c)}
                  style={{
                    width: 18, height: 18, borderRadius: "50%", background: c,
                    border: color === c ? `2px solid ${COLORS.text}` : "2px solid transparent",
                  }}
                />
              ))}
            </div>
            <div className="flex gap-1.5">
              <button
                onClick={submitCreate}
                disabled={!code.trim()}
                style={{
                  flex: 1, background: code.trim() ? COLORS.accent : COLORS.border,
                  color: code.trim() ? "#0D1117" : COLORS.textFaint,
                  borderRadius: 8, padding: "6px 0", fontSize: 12.5, fontWeight: 700,
                }}
              >
                Создать
              </button>
              <button onClick={resetForm} style={{ color: COLORS.textFaint, fontSize: 12.5, padding: "6px 10px" }}>
                Отмена
              </button>
            </div>
          </div>
        )}
      </div>
    </Popover>
  );
}

      status,
      completedAt: status === "done" ? (initial?.completedAt || new Date().toISOString()) : null,

/* ---------------------------------------------------------
   Блок комментариев (двойное сворачивание)
--------------------------------------------------------- */
function Comments({ task, expanded, onToggle, currentUser, onAdd }) {
  const [text, setText] = useState("");
  const count = task.comments.length;

  function submit() {
    if (!text.trim()) return;
    onAdd(task.id, text.trim());
    setText("");
  }

  return (
    <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, marginTop: 10, paddingTop: 8 }}>
      <button
        onClick={onToggle}
        className="flex items-center gap-1.5"
        style={{ color: COLORS.textDim, fontSize: 13, fontWeight: 600 }}
      >
        {expanded ? <Icon name="chevronDown" size={15} /> : <Icon name="chevronRight" size={15} />}
        <Icon name="message" size={14} />
        Комментарии {count > 0 && `(${count})`}
      </button>

      {expanded && (
        <div className="mt-2.5 flex flex-col gap-2">
          {task.comments.length === 0 && (
            <p style={{ color: COLORS.textFaint, fontSize: 13 }}>Пока пусто — оставьте первый комментарий.</p>
          )}
          {task.comments.map((c) => (
            <div key={c.id} style={{ background: COLORS.surface, borderRadius: 10, padding: "8px 10px" }}>
              <div className="flex items-center gap-1.5 mb-1">
                <Avatar personKey={c.author} size={16} />
                <span style={{ color: COLORS.text, fontSize: 12.5, fontWeight: 700 }}>
                  {PEOPLE[c.author]?.name || "Гость"}
                </span>
                <span style={{ color: COLORS.textFaint, fontSize: 11.5 }}>{humanDateTime(c.createdAt)}</span>
              </div>
              <p style={{ color: COLORS.textDim, fontSize: 13.5, whiteSpace: "pre-wrap", lineHeight: 1.4 }}>
                {c.text}
              </p>
            </div>
          ))}
          <div className="flex items-end gap-2 mt-1">
            <textarea
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  submit();
                }
              }}
              placeholder={currentUser ? `Написать как ${PEOPLE[currentUser].name}…` : "Выберите себя вверху страницы…"}
              rows={1}
              style={{
                flex: 1, background: COLORS.surface, border: `1px solid ${COLORS.border}`,
                borderRadius: 9, padding: "8px 10px", color: COLORS.text, fontSize: 13.5,
                outline: "none", resize: "none",
              }}
            />
            <button
              onClick={submit}
              disabled={!text.trim()}
              style={{
                background: text.trim() ? COLORS.accent : COLORS.border,
                color: text.trim() ? "#0D1117" : COLORS.textFaint,
                borderRadius: 9, padding: "8px 12px", fontSize: 13, fontWeight: 700,
                flexShrink: 0,
              }}
            >
              Отправить
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

   Инлайн-редактор причины блокировки (внутри развёрнутой задачи)
--------------------------------------------------------- */
function BlockedEditor({ task, onSave, onCancel }) {
  const [reason, setReason] = useState(task.blocked?.reason || "");
  return (
    <div style={{ background: COLORS.blockedSoft, border: `1px solid ${COLORS.blocked}`, borderRadius: 10, padding: 10 }} className="mb-2.5">
      <input
        autoFocus
        value={reason}
        onChange={(e) => setReason(e.target.value)}
        placeholder="Чего не хватает: данных, ответа, доступа…"
        style={{
          width: "100%", background: COLORS.surface, border: `1px solid ${COLORS.border}`,
          borderRadius: 8, padding: "7px 9px", color: COLORS.text, fontSize: 13, outline: "none",
        }}
        className="mb-2"
      />
      <div className="flex gap-2">
        <button
          onClick={() => onSave(reason.trim())}
          style={{ background: COLORS.blocked, color: "#1A1300", borderRadius: 8, padding: "5px 12px", fontSize: 12.5, fontWeight: 700 }}
        >
          Сохранить
        </button>
        <button onClick={onCancel} style={{ color: COLORS.textFaint, fontSize: 12.5, padding: "5px 10px" }}>
          Отмена
        </button>

}

/* ---------------------------------------------------------
   Строка задачи
--------------------------------------------------------- */
function TaskRow({
  task, project, expanded, onToggleExpand, commentsExpanded, onToggleComments,
  onToggleDone, onSetProgress, onEdit, onAddComment, currentUser, todayDone,
  onSetBlocked,
}) {
  const [editingBlocked, setEditingBlocked] = useState(false);
  const isActive = task.status === "active";
  const isOverdue = isActive && task.dueDate && task.dueDate < todayStr() && !task.blocked;
  const isDone = task.status === "done";
  const isCancelled = task.status === "cancelled";
  const isDeferred = task.status === "deferred";
  const person = task.assignee ? PEOPLE[task.assignee] : null;

  let leftBorder = person?.color || COLORS.border;
  if (isCancelled) leftBorder = COLORS.cancelled;
  else if (isDone) leftBorder = COLORS.success;
  else if (isDeferred) leftBorder = COLORS.deferred;
  else if (task.blocked) leftBorder = COLORS.blocked;
  else if (isOverdue) leftBorder = COLORS.danger;

  return (
    <div
      style={{
        background: COLORS.surface, border: `1px solid ${COLORS.border}`,
        borderLeft: `3px solid ${leftBorder}`, borderRadius: 12,
        padding: "10px 12px", marginBottom: 8, opacity: isCancelled ? 0.65 : 1,
      }}
    >
      <div className="flex items-start gap-2.5">
        <button
          onClick={() => onToggleDone(task)}
          title={task.recurring ? (todayDone ? "Снять отметку за сегодня" : "Отметить выполненным сегодня") : (isDone ? "Вернуть в работу" : "Отметить выполненным")}
          style={{ marginTop: 1, flexShrink: 0, color: (isDone || todayDone) ? COLORS.success : COLORS.textFaint }}
        >
          {(isDone || todayDone) ? <Icon name="checkCircle" size={20} /> : <Icon name="circle" size={20} />}
        </button>

        <div className="flex-1 min-w-0" onClick={onToggleExpand} style={{ cursor: "pointer" }}>
          <div className="flex items-center flex-wrap gap-x-2 gap-y-1">
            {project && (
              <Pill color={project.color} bg={`${project.color}20`} style={{ fontWeight: 800 }}>
                {project.code}
              </Pill>
            )}
            <span
              style={{
                color: (isDone || isCancelled) ? COLORS.textFaint : COLORS.text,
                textDecoration: (isDone || isCancelled) ? "line-through" : "none",
                fontSize: 14.5, fontWeight: 600, lineHeight: 1.3,
              }}
            >
              {task.title}
            </span>
            {isDeferred && <Pill color={COLORS.deferred} bg={COLORS.deferredSoft}><Icon name="archive" size={11} /> отложена</Pill>}
            {isCancelled && <Pill color={COLORS.cancelled} bg={COLORS.cancelledSoft}><Icon name="ban" size={11} /> отменена</Pill>}
            {task.blocked && (
              <Pill color={COLORS.blocked} bg={COLORS.blockedSoft} title={task.blocked.reason}>
                <Icon name="flag" size={11} /> {task.blocked.reason ? task.blocked.reason : "не хватает данных"}
              </Pill>
            )}
            {task.recurring && (
              <Pill color={COLORS.accent} bg={COLORS.accentSoft} title={FREQ[task.recurring.freq].label}>
                <Icon name="repeat" size={11} /> {FREQ[task.recurring.freq].short}
              </Pill>
            )}
            {task.comments.length > 0 && (
              <Pill>
                <Icon name="message" size={11} /> {task.comments.length}
              </Pill>
            )}
          </div>

          <div className="flex items-center flex-wrap gap-x-3 gap-y-1 mt-1">
            {person && (
              <span className="flex items-center gap-1.5" style={{ fontSize: 12.5, color: COLORS.textDim }}>
                <Avatar personKey={task.assignee} size={16} /> {person.name}
              </span>
            )}
            {task.dueDate && (
              <span
                className="flex items-center gap-1"
                style={{ fontSize: 12.5, color: isOverdue ? COLORS.danger : COLORS.textDim, fontWeight: isOverdue ? 700 : 400 }}
              >
                {isOverdue ? <Icon name="alertTriangle" size={12.5} /> : <Icon name="calendar" size={12.5} />}
                {isOverdue ? `просрочено · ${humanDate(task.dueDate)}` : humanDate(task.dueDate)}
              </span>
            )}
            {task.recurring && task.history?.length > 0 && (
              <span style={{ fontSize: 12.5, color: COLORS.textFaint }}>
                выполнялась {task.history.length} раз
              </span>
            )}
            {isActive && !task.blocked && task.progress > 0 && (
              <span style={{ fontSize: 12.5, color: COLORS.textFaint, fontVariantNumeric: "tabular-nums" }}>
                {task.progress}%
              </span>
            )}
          </div>

          {isActive && !task.blocked && task.progress > 0 && (
            <div style={{ height: 4, background: COLORS.border, borderRadius: 999, marginTop: 7, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${task.progress}%`, background: COLORS.accent, borderRadius: 999 }} />
            </div>
          )}
        </div>

        <button onClick={onToggleExpand} style={{ color: COLORS.textFaint, marginTop: 2, flexShrink: 0 }}>
          {expanded ? <Icon name="chevronDown" size={18} /> : <Icon name="chevronRight" size={18} />}
        </button>
      </div>

      {expanded && (
        <div style={{ marginTop: 10, paddingLeft: 30 }}>
          {task.desc && (
            <p style={{ color: COLORS.textDim, fontSize: 13.5, lineHeight: 1.5, whiteSpace: "pre-wrap" }} className="mb-2.5">
              {task.desc}
            </p>
          )}

          {isActive && !task.recurring && !task.blocked && (
            <div className="flex items-center gap-2 mb-2.5 flex-wrap">
              <span style={{ color: COLORS.textFaint, fontSize: 12, fontWeight: 600 }}>Прогресс:</span>
              {[0, 25, 50, 75, 100].map((v) => (
                <button
                  key={v}
                  onClick={() => onSetProgress(task, v)}
                  style={{
                    padding: "3px 9px", borderRadius: 999, fontSize: 12, fontWeight: 600,
                    border: `1px solid ${task.progress === v ? COLORS.accent : COLORS.border}`,
                    color: task.progress === v ? COLORS.accent : COLORS.textFaint,
                    background: task.progress === v ? COLORS.accentSoft : "transparent",
                  }}
                >
                  {v}%
                </button>
              ))}
            </div>
          )}

          {isActive && editingBlocked && (
            <BlockedEditor
              task={task}
              onSave={(reason) => { onSetBlocked(task, { reason, since: task.blocked?.since || new Date().toISOString() }); setEditingBlocked(false); }}
              onCancel={() => setEditingBlocked(false)}
            />
          )}

          <div className="flex items-center gap-3 mb-1 flex-wrap">
            <button onClick={() => onEdit(task)} className="flex items-center gap-1" style={{ color: COLORS.textDim, fontSize: 12.5, fontWeight: 600 }}>
              <Icon name="pencil" size={13} /> Изменить
            </button>
            {isActive && !editingBlocked && (
              task.blocked ? (
                <button onClick={() => onSetBlocked(task, null)} className="flex items-center gap-1" style={{ color: COLORS.blocked, fontSize: 12.5, fontWeight: 600 }}>
                  <Icon name="check" size={13} /> Снять блокировку
                </button>
              ) : (
                <button onClick={() => setEditingBlocked(true)} className="flex items-center gap-1" style={{ color: COLORS.textDim, fontSize: 12.5, fontWeight: 600 }}>
                  <Icon name="flag" size={13} /> Не хватает данных
                </button>
              )
            )}
          </div>

          <Comments
            task={task}
            expanded={commentsExpanded}
            onToggle={onToggleComments}
            currentUser={currentUser}
            onAdd={onAddComment}
          />
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Основное приложение
--------------------------------------------------------- */
function App() {
  const [tasks, setTasks] = useState([]);
  const [projects, setProjects] = useState(DEFAULT_PROJECTS);
  const [loading, setLoading] = useState(true);
  const [currentUser, setCurrentUser] = useState(null);
  const [filterAssignee, setFilterAssignee] = useState([]);
  const [filterProject, setFilterProject] = useState(null);
  const [filterStatus, setFilterStatus] = useState("active");
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const [commentIds, setCommentIds] = useState(() => new Set());
  const [modal, setModal] = useState({ open: false, task: null });
  const [userPopoverOpen, setUserPopoverOpen] = useState(false);

  useEffect(() => {
    let cancelled = false;

    async function fetchAll() {
      const [{ data: tRows, error: tErr }, { data: pRows, error: pErr }] = await Promise.all([
        sb.from("tasks").select("*").order("created_at", { ascending: false }),
        sb.from("projects").select("*").order("code"),
      ]);
      if (tErr) console.error("Не удалось загрузить задачи", tErr);
      if (pErr) console.error("Не удалось загрузить проекты", pErr);
      if (cancelled) return;
      setTasks((tRows || []).map(rowToTask));
      if (pRows && pRows.length > 0) {
        setProjects(pRows.map(rowToProject));
      } else {
        setProjects(DEFAULT_PROJECTS);
        await sb.from("projects").upsert(DEFAULT_PROJECTS.map(projectToRow));
      }
      setCurrentUser(loadCurrentUser());
      setLoading(false);
    }
    fetchAll();

    function handleTaskChange(payload) {
      if (payload.eventType === "DELETE") {
        setTasks((prev) => prev.filter((t) => t.id !== payload.old.id));
        return;
      }
      const task = rowToTask(payload.new);
      setTasks((prev) => {
        const exists = prev.some((t) => t.id === task.id);
        return exists ? prev.map((t) => (t.id === task.id ? task : t)) : [task, ...prev];
      });
    }
    function handleProjectChange(payload) {
      if (payload.eventType === "DELETE") {
        setProjects((prev) => prev.filter((p) => p.id !== payload.old.id));
        return;
      }
      const project = rowToProject(payload.new);
      setProjects((prev) => {
        const exists = prev.some((p) => p.id === project.id);
        return exists ? prev.map((p) => (p.id === project.id ? project : p)) : [...prev, project];
      });
    }

    const channel = sb
      .channel("zadachnik-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, handleTaskChange)
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, handleProjectChange)
      .subscribe();

    return () => {
      cancelled = true;
      sb.removeChannel(channel);
    };
  }, []);

  function commitTask(updatedTask) {
    setTasks((prev) => prev.map((t) => (t.id === updatedTask.id ? updatedTask : t)));
    persistTask(updatedTask);
  }

  function addProject(project) {
    setProjects((prev) => [...prev, project]);
    persistProjectRow(project);
  }

  function toggleExpand(id) {
    setExpandedIds((prev) => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  }
  function toggleComments(id) {
    setCommentIds((prev) => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  }

  function openNewTask() {
    setModal({ open: true, task: null });
  }
  function openEditTask(task) {
    setModal({ open: true, task });
  }

  function saveTask(data) {
    if (modal.task) {
      commitTask({ ...modal.task, ...data });
    } else {
      const newTask = {
        id: uid("t"),
        ...data,
        progress: 0,
        createdAt: new Date().toISOString(),
        history: [],
        comments: [],
      };
      setTasks((prev) => [newTask, ...prev]);
      persistTask(newTask);
    }
    setModal({ open: false, task: null });
  }
  function deleteTask(id) {
    setTasks((prev) => prev.filter((t) => t.id !== id));
    removeTaskRow(id);
    setModal({ open: false, task: null });
  }

  function toggleDone(task) {
    const today = todayStr();
    if (task.recurring) {
      const didToday = task.history?.some((h) => h.date === today);
      const updated = didToday
        ? { ...task, history: task.history.filter((h) => h.date !== today) }
        : {
            ...task,
            history: [...task.history, { date: today }],
            dueDate: addToDate(task.dueDate && task.dueDate >= today ? task.dueDate : today, task.recurring.freq),
            progress: 0,
          };
      commitTask(updated);
    } else {
      const willBeDone = task.status !== "done";
      commitTask({
        ...task,
        status: willBeDone ? "done" : "active",
        progress: willBeDone ? 100 : task.progress,
        completedAt: willBeDone ? new Date().toISOString() : null,
        blocked: willBeDone ? null : task.blocked,
      });
    }
  }

  function setProgress(task, value) {
    commitTask({ ...task, progress: value });
  }

  function setBlocked(task, blocked) {
    commitTask({ ...task, blocked });
  }

  function addComment(taskId, text) {
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    const comment = {
      id: uid("c"),
      author: currentUser,
      text,
      createdAt: new Date().toISOString(),
    };
    commitTask({ ...task, comments: [...task.comments, comment] });
    setCommentIds((prev) => new Set(prev).add(taskId));
  }

  function pickUser(key) {
    setCurrentUser(key);
    persistCurrentUser(key);
    setUserPopoverOpen(false);
  }

  const projectById = useMemo(() => Object.fromEntries(projects.map((p) => [p.id, p])), [projects]);

  /* --------- фильтрация и группировка --------- */
  const filtered = useMemo(() => {
    return tasks.filter((t) => {
      if (filterAssignee.length > 0 && !filterAssignee.includes(t.assignee)) return false;
      if (filterProject && t.projectId !== filterProject) return false;
      if (filterStatus === "active" && t.status !== "active") return false;
      if (filterStatus === "deferred" && t.status !== "deferred") return false;
      if (filterStatus === "done" && t.status !== "done") return false;
      return true;
    });
  }, [tasks, filterAssignee, filterProject, filterStatus]);

  const groups = useMemo(() => {
    const today = todayStr();
    const active = filtered.filter((t) => t.status === "active");
    const blocked = active.filter((t) => t.blocked);
    const free = active.filter((t) => !t.blocked);

    const overdue = free.filter((t) => t.dueDate && t.dueDate < today);
    const dueToday = free.filter((t) => t.dueDate === today);
    const upcoming = free.filter((t) => t.dueDate && t.dueDate > today);
    const noDate = free.filter((t) => !t.dueDate);

    const byDate = (a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
    const byCreated = (a, b) => (b.createdAt || "").localeCompare(a.createdAt || "");

    return {
      blocked: blocked.sort(byCreated),
      overdue: overdue.sort(byDate),
      dueToday: dueToday.sort(byCreated),
      upcoming: upcoming.sort(byDate),
      noDate: noDate.sort(byCreated),
      deferred: filtered.filter((t) => t.status === "deferred").sort(byCreated),
      done: filtered.filter((t) => t.status === "done").sort((a, b) => (b.completedAt || "").localeCompare(a.completedAt || "")),
      cancelled: filtered.filter((t) => t.status === "cancelled").sort(byCreated),
    };
  }, [filtered]);

  const stats = useMemo(() => {
    const today = todayStr();
    const active = tasks.filter((t) => t.status === "active");
    return {
      active: active.length,
      overdue: active.filter((t) => !t.blocked && t.dueDate && t.dueDate < today).length,
      today: active.filter((t) => !t.blocked && t.dueDate === today).length,
      blocked: active.filter((t) => t.blocked).length,
    };
  }, [tasks]);

  const rowProps = {
    currentUser,
    onToggleDone: toggleDone,
    onSetProgress: setProgress,
    onSetBlocked: setBlocked,
    onEdit: openEditTask,
    onAddComment: addComment,
  };

  function renderSection(title, list, tone, icon, key, defaultOpen = true) {
    if (list.length === 0) return null;
    return (
      <SectionBlock title={title} tone={tone} icon={icon} count={list.length} defaultOpen={defaultOpen} key={key}>
        {list.map((t) => {
          const today = todayStr();
          const todayDone = t.recurring ? t.history?.some((h) => h.date === today) : false;
          return (
            <TaskRow
              key={t.id}
              task={t}
              project={t.projectId ? projectById[t.projectId] : null}
              {...rowProps}
              expanded={expandedIds.has(t.id)}
              onToggleExpand={() => toggleExpand(t.id)}
              commentsExpanded={commentIds.has(t.id)}
              onToggleComments={() => toggleComments(t.id)}
              todayDone={todayDone}
            />
          );
        })}
      </SectionBlock>
    );
  }

  const showActiveGroups = filterStatus === "active" || filterStatus === "all";
  const showDeferred = filterStatus === "deferred" || filterStatus === "all";
  const showDone = filterStatus === "done" || filterStatus === "all";
  const showCancelled = filterStatus === "all";

  const totalShown =
    groups.blocked.length + groups.overdue.length + groups.dueToday.length + groups.upcoming.length + groups.noDate.length +
    (showDeferred ? groups.deferred.length : 0) + (showDone ? groups.done.length : 0) + (showCancelled ? groups.cancelled.length : 0);

  return (
    <div style={{ background: COLORS.bg, minHeight: "100%", fontFamily: "'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif" }}>
      
      {/* Шапка */}
      <header style={{ background: COLORS.bgHeader, borderBottom: `1px solid ${COLORS.border}`, position: "sticky", top: 0, zIndex: 20 }}>
        <div className="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
          <div>
            <h1 style={{ color: COLORS.text, fontSize: 19, fontWeight: 800, letterSpacing: -0.2 }}>Задачник</h1>
            <p style={{ color: COLORS.textFaint, fontSize: 12, marginTop: 1 }}>
              {stats.active} активных
              {stats.overdue > 0 && <span style={{ color: COLORS.danger }}> · {stats.overdue} просрочено</span>}
              {stats.blocked > 0 && <span style={{ color: COLORS.blocked }}> · {stats.blocked} без ресурса</span>}
              {stats.today > 0 && <span> · {stats.today} сегодня</span>}
            </p>
          </div>

          <div className="flex items-center gap-2">
            <Popover
              open={userPopoverOpen}
              onOpenChange={setUserPopoverOpen}
              align="right"
              trigger={
                <button
                  onClick={() => setUserPopoverOpen((s) => !s)}
                  className="flex items-center gap-1.5"
                  style={{
                    border: `1px solid ${COLORS.border}`, borderRadius: 999,
                    padding: currentUser ? "3px 10px 3px 3px" : "6px 10px",
                    background: COLORS.surface,
                  }}
                >
                  {currentUser ? (
                    <>
                      <Avatar personKey={currentUser} size={22} />
                      <span style={{ color: COLORS.text, fontSize: 13, fontWeight: 600 }}>{PEOPLE[currentUser].name}</span>
                    </>
                  ) : (
                    <>
                      <Icon name="user" size={15} color={COLORS.textDim} />
                      <span style={{ color: COLORS.textDim, fontSize: 13, fontWeight: 600 }}>Я — это…</span>
                    </>
                  )}
                </button>
              }
            >
              {PEOPLE_LIST.map((k) => (
                <PopoverItem key={k} active={currentUser === k} onClick={() => pickUser(k)}>
                  <Avatar personKey={k} size={20} /> {PEOPLE[k].name}
                </PopoverItem>
              ))}
            </Popover>

            <button
              onClick={openNewTask}
              className="flex items-center gap-1.5"
              style={{
                background: COLORS.accent, color: "#0D1117", borderRadius: 10,
                padding: "8px 12px", fontSize: 13.5, fontWeight: 700,
              }}
            >
              <Icon name="plus" size={16} /> <span className="hidden sm:inline">Задача</span>
            </button>
          </div>
        </div>

        {/* Фильтры */}
        <div className="max-w-3xl mx-auto px-4 pb-3 flex items-center gap-2 flex-wrap">
          <div className="flex items-center gap-1.5">
            {["active", "deferred", "done", "all"].map((s) => (
              <button
                key={s}
                onClick={() => setFilterStatus(s)}
                style={{
                  padding: "5px 11px", borderRadius: 999, fontSize: 12.5, fontWeight: 700,
                  color: filterStatus === s ? COLORS.text : COLORS.textFaint,
                  background: filterStatus === s ? COLORS.surfaceRaised : "transparent",
                  border: `1px solid ${filterStatus === s ? COLORS.border : "transparent"}`,
                }}
              >
                {s === "active" ? "Активные" : s === "deferred" ? "Отложенные" : s === "done" ? "Выполненные" : "Все"}
              </button>
            ))}
          </div>
          <div style={{ width: 1, height: 16, background: COLORS.border }} />
          <AssigneeFilterDropdown value={filterAssignee} onChange={setFilterAssignee} />
          <ProjectDropdown projects={projects} value={filterProject} onChange={setFilterProject} onCreate={addProject} allowAll />
        </div>
      </header>

      {/* Контент */}
      <main className="max-w-3xl mx-auto px-4 py-5" style={{ paddingBottom: 90 }}>
        {loading ? (
          <div className="flex items-center justify-center" style={{ padding: "60px 0", color: COLORS.textFaint }}>
            <Icon name="loader" size={20} className="animate-spin" />
            <span className="ml-2" style={{ fontSize: 14 }}>Загружаем задачи…</span>
          </div>
        ) : totalShown === 0 ? (
          <div className="flex flex-col items-center text-center" style={{ padding: "70px 20px", color: COLORS.textFaint }}>
            <Icon name="inbox" size={30} style={{ marginBottom: 10, opacity: 0.6 }} />
            <p style={{ fontSize: 14.5, color: COLORS.textDim, fontWeight: 600 }}>
              {filterStatus === "done" ? "Выполненных задач пока нет" : filterStatus === "deferred" ? "Отложенных задач нет" : "Задач по этим фильтрам нет"}
            </p>
            <p style={{ fontSize: 13, marginTop: 4 }}>Добавьте задачу кнопкой выше — или смените фильтры.</p>
          </div>
        ) : (
          <>
            {showActiveGroups && renderSection("Не хватает ресурса", groups.blocked, COLORS.blocked, <Icon name="flag" size={13} color={COLORS.blocked} />, "blocked")}
            {showActiveGroups && renderSection("Просрочено", groups.overdue, COLORS.danger, <Icon name="alertTriangle" size={13} color={COLORS.danger} />, "overdue")}
            {showActiveGroups && renderSection("Сегодня", groups.dueToday, COLORS.text, <Icon name="calendar" size={13} color={COLORS.textDim} />, "today")}
            {showActiveGroups && renderSection("Предстоящие", groups.upcoming, COLORS.textDim, <Icon name="calendar" size={13} color={COLORS.textFaint} />, "upcoming")}
            {showActiveGroups && renderSection("Без срока", groups.noDate, COLORS.textDim, <Icon name="circle" size={13} color={COLORS.textFaint} />, "nodate")}
            {showDeferred && renderSection("Отложено", groups.deferred, COLORS.deferred, <Icon name="archive" size={13} color={COLORS.deferred} />, "deferred", filterStatus === "deferred")}
            {showDone && renderSection("Выполнено", groups.done, COLORS.success, <Icon name="checkCircle" size={13} color={COLORS.success} />, "done", filterStatus === "done")}
            {showCancelled && renderSection("Отменено", groups.cancelled, COLORS.cancelled, <Icon name="ban" size={13} color={COLORS.cancelled} />, "cancelled", false)}
          </>
        )}
      </main>

      {/* Плавающая кнопка на мобильных */}
      <button
        onClick={openNewTask}
        className="sm:hidden"
        style={{
          position: "fixed", right: 18, bottom: 18, width: 52, height: 52, borderRadius: "50%",
          background: COLORS.accent, color: "#0D1117", display: "flex", alignItems: "center",
          justifyContent: "center", boxShadow: "0 6px 18px rgba(91,141,239,0.4)", zIndex: 25,
        }}
        aria-label="Новая задача"
      >
        <Icon name="plus" size={24} />
      </button>

      {modal.open && (
        <TaskModal
          initial={modal.task}
          projects={projects}
          onClose={() => setModal({ open: false, task: null })}
          onSave={saveTask}
          onDelete={deleteTask}
          onCreateProject={addProject}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Свёрнутая/развёрнутая секция списка
--------------------------------------------------------- */
function SectionBlock({ title, tone, icon, count, defaultOpen, children }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="mb-5">
      <button onClick={() => setOpen((o) => !o)} className="flex items-center gap-2 mb-2">
        {open ? <Icon name="chevronDown" size={14} color={COLORS.textFaint} /> : <Icon name="chevronRight" size={14} color={COLORS.textFaint} />}
        {icon}
        <span style={{ color: tone, fontSize: 13, fontWeight: 700, letterSpacing: 0.2 }}>{title}</span>
        <span style={{ color: COLORS.textFaint, fontSize: 12.5 }}>{count}</span>
      </button>
      {open && children}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

  var s = document.createElement("script");
  s.text = out;
  document.body.appendChild(s);
